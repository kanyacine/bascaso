name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run without pushing a commit (Actions tab -> Run workflow).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Fork-specific job. What `tsc --noEmit` and vitest do not see:
  #  - drizzle-kit check: the migrations in `drizzle/` are consistent with each other.
  #    The real risk here is adding a column to the schema without generating the
  #    matching migration – the typecheck stays green, the app breaks at boot.
  #  - electron:compile: `electron/` has its own tsconfig, outside the app's tsc scope.
  #    A breakage there went unnoticed until packaging.
  #  - next build: the only step validating the server/client boundaries, the generated
  #    route types and page rendering. A component marked "use client" that imports a
  #    server-only module compiles perfectly well and breaks the build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit check
      - run: npm run electron:compile
      - run: npx next build
