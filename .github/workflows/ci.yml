name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer la CI sans pousser un commit (onglet Actions -> Run workflow).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Job propre au fork. Ce que `tsc --noEmit` et vitest ne voient pas :
  #  - drizzle-kit check : les migrations de `drizzle/` sont cohérentes entre elles.
  #    Le vrai risque ici est d'ajouter une colonne au schéma sans générer la
  #    migration correspondante – le typecheck reste vert, l'app casse au boot.
  #  - electron:compile : `electron/` a son propre tsconfig, hors du champ du tsc
  #    de l'app. Une rupture y passait inaperçue jusqu'au packaging.
  #  - next build : le seul à valider les frontières serveur/client, les types de
  #    routes générés et le rendu des pages. Un composant marqué "use client" qui
  #    importe un module server-only compile très bien et casse au build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit check
      - run: npm run electron:compile
      - run: npx next build
